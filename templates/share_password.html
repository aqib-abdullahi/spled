{% extends "base.html" %}
{% block title %}Enter the password{% endblock %}
{% block body %}
<main class="page" style="max-width:480px;margin:48px auto">
  <div class="card stack">
    <h1>Enter the password</h1>
    <p class="muted">{{ org.public_name|default:org.name }} shared something with you. Enter the password you were given to view it.</p>
    <form method="post" class="stack" novalidate>
      {% csrf_token %}
      {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
      <div class="field">
        <label for="share-password">Password</label>
        <input type="password" id="share-password" name="password" autocomplete="current-password" required autofocus>
      </div>
      <button class="btn btn-dark" type="submit">View</button>
    </form>
  </div>
</main>
{% endblock %}
